<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Relative Position</title>
        <style>
            .box1{
                width: 600px;
                height: 400px;
                margin: 20px auto;
                background: yellow;
                position: relative;
            }
            .box2{
                width: 300px;
                height: 200px;
                background: cyan;
                position: absolute;
                top: 100px;
                left: 150px;
            }
        </style>
    </head>
    <body>
        <div class="box1">
            <div class="box2"></div>
        </div>
    </body>
</html>
