<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CSS Reset</title>
        <style>
            h1,h2{
                font-size: inherit;
                font-weight: normal;
                margin: 0;
                padding: 0;
            }
            ul{
                list-style: none;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <h1>Main Heading</h1>
        <h2>Sub Heading</h2>
        <ul>
            <li>Item One</li>
            <li>Item Two</li>
        </ul>
    </body>
</html>
