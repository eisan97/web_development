<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CSS Position</title>
        <style>
            .box1{
                width: 300px;
                height: 1000px;
                background: cyan;
                position: absolute; /* dispaly with scroll bar */
                /* position: fixed; */ /* not display with scroll bar */
                top: 100px;
                left: 100px;
            }
            .box2{
                width: 350px;
                height: 2000px;
                background: yellow;
                position: absolute;
                top: 300px;
                left: 400px;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
    </body>
</html>
