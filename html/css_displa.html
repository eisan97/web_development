<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS Display</title>
        <link rel="stylesheet" href="/home/thin_ei/DEV/Testing/JS/web_development/css/css_display.css">
    </head>
    <body>
        <!-- block element => နေရာရှိသလောက် အပြည့်နေရာယူ and အပေါ်အောက် နေရာယူ -->
        <div>A block</div>
        <div>Another block</div>

        <!-- inline element => content ရှိသလောက်ပဲ နေရာယူ 
            and ဘေးတိုက်နေရာယူ and width/height ထည့်လဲ အလုပ်မလုပ်ပါ 
            and display type ကို block ပြောင်းရင် block element အတိုင်း အလုပ်လုပ်ပါတယ် -->
        <span>Some content</span>
        <span>More content</span>
    </body>
</html>
