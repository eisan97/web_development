<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Grid System and Responsive Layouts</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <main class="bg-secondary py-5">
            <div class="container bg-light">
                <div class="bg-light" style="height: 400px"></div>
            </div>
        </main>
        <section class="container py-5">
            <div class="row g-5">
                <div class="col-3 com-md-6 col-lg3">
                    <div class="bg-secondary" style="height: 200px"></div>
                </div>
                <div class="col-3 com-md-6 col-lg3">
                    <div class="bg-secondary" style="height: 200px"></div>
                </div>
                <div class="col-3 com-md-6 col-lg3">
                    <div class="bg-secondary" style="height: 200px"></div>
                </div>
                <div class="col-3 com-md-6 col-lg3">
                    <div class="bg-secondary" style="height: 200px"></div>
                </div>
            </div>
        </section>
        <footer class="container">
            <div class="border-top border-top-2 py-5 text-center text-muted">
                &copy; Copyright 2020
            </div>
        </footer>
    </body>
</html>
