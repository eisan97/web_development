<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS Box Model</title>
        <style>
            section{
                display: flex;
            }
            nav, main, aside{
                height: 400px;
                background: cyan;
                margin: 10px;
                flex-grow: 1;
            }
            main{
                flex-grow: 3;
            } 
            @media(max-width:800px){
                section{
                    flex-wrap: wrap;
                }
                aside{
                    flex: 100%;
                    height: 200px;
                }
            }
            @media (max-width: 500px){
                nav, main, aside{
                    flex: 100%;
                    height: 200px;
                }
            }
        </style>
    </head>
    <body>
        <section>
            <nav></nav>
            <main></main>
            <aside></aside>
        </section>
    </body>
</html>
